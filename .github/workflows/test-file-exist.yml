name: "Check File Existence"

on: [push, pull_request]

jobs:
  check_file_existence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check file existence
        if: ${{ hashFiles('234234234ndex.html') != '' }}
        run: echo "::notice file=234234234ndex.html,title=File exist::File exist"

      - name: Check file non-existence
        if: ${{ hashFiles('234234234ndex.html') == '' }}
        run: echo "::error file=234234234.html,title=File does not exist::File does not exist"
